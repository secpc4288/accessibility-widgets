stages:
  - install
  - quality
  - build

default:
  image: node:20
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.22.0 --activate

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

variables:
  PNPM_HOME: /root/.local/share/pnpm
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"

install:
  stage: install
  script:
    - pnpm config set store-dir "$PNPM_STORE_PATH"
    - pnpm install --frozen-lockfile=false
  artifacts:
    paths:
      - node_modules
      - "**/node_modules"
      - apps/api/node_modules/.prisma
    expire_in: 1 hour

lint_typecheck:
  stage: quality
  needs: ["install"]
  script:
    - pnpm typecheck
  allow_failure: true

test:
  stage: quality
  needs: ["install"]
  script:
    - pnpm --filter @a11y/core test
    - pnpm --filter @a11y/widget test
    - pnpm --filter @a11y/scanner test
    - pnpm --filter @a11y/api test

build:
  stage: build
  needs: ["install", "test"]
  script:
    - pnpm --filter @a11y/core build
    - pnpm --filter @a11y/fonts build
    - pnpm --filter @a11y/widget build
    - pnpm --filter @a11y/scanner build
    - node scripts/check-widget-size.mjs
  artifacts:
    paths:
      - packages/widget/dist
    expire_in: 1 week
